{% extends "base.html" %}
{% block title %}Delete Invoice{% endblock %}
{% block content %}
<h1>Delete Invoice {{ invoice.invoice_number }}?</h1>

<p>This will permanently delete this invoice and its line items. This can't be undone.</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="danger">Yes, delete it</button>
  <a href="{% url 'invoice_detail' invoice.pk %}">Cancel</a>
</form>
{% endblock %}
