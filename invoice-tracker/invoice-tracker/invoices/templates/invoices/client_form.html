{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>

<form method="post">
  {% csrf_token %}
  <table>
    {{ form.as_table }}
  </table>
  <p><button type="submit">Save Client</button></p>
</form>

<p>
  {% if client %}
    <a href="{% url 'client_list' %}">&larr; Back to clients</a>
  {% else %}
    <a href="{% url 'invoice_list' %}">&larr; Back to invoice list</a>
  {% endif %}
</p>
{% endblock %}
